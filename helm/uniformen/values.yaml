common:
  app: uniformen
  appId: uniformen
  team: portal
  ingress:
    enabled: true
    trafficType: public
  service:
    internalPort: 3000
  deployment:
    #prometheus:
    #  enabled: true
    minReplicas: 2
  container:
    image: <+artifacts.primary.image>
    cpu: 0.1
    memory: 100
    probes:
      enabled: true
  configmap:
    enabled: true
    data:
      TZ: "Europe/Oslo"
  secrets:
    auth-credentials:
      - MNG_AUTH0_INT_CLIENT_ID
      - MNG_AUTH0_INT_CLIENT_SECRET
