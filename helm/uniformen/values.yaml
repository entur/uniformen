common:
  app: uniformen
  shortname: uniformen
  team: portal
  ingress:
    enabled: true
    trafficType: public
  service:
    internalPort: 4123
  container:
    image: <+artifacts.primary.image>
    # Run at least two pods in every environment, so traffic can go to another pod
    # during a rollout. Setting `maxReplicas` turns on the autoscaler (HPA) outside
    # prd. In prd the chart always turns it on. With the autoscaler on, `replicas` is
    # the minimum number of pods.
    replicas: 2
    maxReplicas: 6
    cpu: 0.2
    cpuLimit: 1
    memory: 150
    memoryLimit: 150
    # Prometheus scrapes /actuator/prometheus on the service port. The app serves its
    # metrics there.
    prometheus:
      enabled: true
    # The default probe paths are /actuator/health/liveness and
    # /actuator/health/readiness. The app serves both.
    probes:
      enabled: true
  configmap:
    enabled: true
    data:
      TZ: "Europe/Oslo"
  secrets:
    auth-credentials:
      - MNG_AUTH0_INT_CLIENT_ID
      - MNG_AUTH0_INT_CLIENT_SECRET
