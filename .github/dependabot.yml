version: 2
enable-beta-ecosystems: true
registries:
  jfrog-artifactory:
    type: npm-registry
    url: "https://entur2.jfrog.io/entur2"
    token: ${{secrets.ARTIFACTORY_AUTH_TOKEN}}
updates:
  # Major updates will not be grouped together for github-actions updates
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Group patch and minor, but major updates will not be grouped together for bun updates
  - package-ecosystem: "bun"
    directory: "/"
    commit-message:
      prefix: "chore"
    registries:
      - jfrog-artifactory
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    target-branch: "main"
    cooldown:
      default-days: 7

  # The package is released by release-please; its dependencies live in their own
  # lockfile (packages/uniformen/bun.lock) and are not covered by the root "/" entry.
  # "chore" keeps these out of the release notes and cuts no release.
  - package-ecosystem: "bun"
    directory: "/packages/uniformen"
    commit-message:
      prefix: "chore"
    registries:
      - jfrog-artifactory
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    target-branch: "main"
    cooldown:
      default-days: 7

  # Major updates will not be grouped together for docker updates
  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
