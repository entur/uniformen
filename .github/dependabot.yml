version: 2
enable-beta-ecosystems: true
registries:
  jfrog-artifactory:
    type: npm-registry
    url: "https://entur2.jfrog.io/entur2"
    token: ${{secrets.ARTIFACTORY_AUTH_TOKEN}}
updates:
  # Group minor and patch updates into one PR. Major updates get their own PR.
  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      # Every other Monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # Group minor and patch updates into one PR. Major updates get their own PR.
  - package-ecosystem: "bun"
    directory: "/"
    commit-message:
      prefix: "chore"
    registries:
      - jfrog-artifactory
    schedule:
      # Every other Monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    target-branch: "main"
    cooldown:
      default-days: 7

  # packages/uniformen has its own lockfile, so the root "/" entry does not update it.
  # With the "chore" prefix, release-please leaves these updates out of the release
  # notes and does not make a release for them.
  - package-ecosystem: "bun"
    directory: "/packages/uniformen"
    commit-message:
      prefix: "chore"
    registries:
      - jfrog-artifactory
    schedule:
      # Every other Monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    target-branch: "main"
    cooldown:
      default-days: 7

  # Group minor and patch updates into one PR. Major updates get their own PR.
  - package-ecosystem: "docker"
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      # Every other Monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
