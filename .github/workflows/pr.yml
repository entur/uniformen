name: PR
on:
  pull_request:

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@eebe21e7625a695085aefd79f64893a34adc2302 # v2.0.0
    with:
      environment: dev
      chart: helm/uniformen

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - name: Audit (fail on critical)
        run: bun audit --audit-level=critical

  build-package:
    name: Build uniformen package
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.prepare-packages.outputs.artifact_name }}
    defaults:
      run:
        working-directory: packages/uniformen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - id: prepare-packages
        uses: entur/gha-npmjs/.github/actions/prepare-packages@d1701803b89f6393047cdff568ba264b25cefd2d # v1.0.0
        with:
          release_type: manifest
          package_manager: bun

  publish-package-dry-run:
    name: Publish uniformen package (dry run)
    needs: [build-package]
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-npmjs/.github/workflows/publish.yml@d1701803b89f6393047cdff568ba264b25cefd2d # v1.0.0
    with:
      artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      provenance: true
      dry_run: true

  docker-build:
    uses: entur/gha-docker/.github/workflows/build.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@aafa20a94ac3b2fbafb2951747b92a570e9e8542 # v2.16.0
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
    secrets:
      external_repository_token: ${{ secrets.EXTERNAL_REPOSITORY_TOKEN }}
