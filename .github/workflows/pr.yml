name: PR
on:
  pull_request:

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev
      chart: helm/uniformen

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Dependabot does not update this version. Bump it by hand.
          version: 2026.9.18
          # mise.toml only pins the Bun major. Refresh the cache daily so CI gets new versions.
          cache_max_age_days: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - name: Audit (fail on critical)
        run: bun audit --audit-level=critical

  build-package:
    name: Build uniformen package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/uniformen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Dependabot does not update this version. Bump it by hand.
          version: 2026.9.18
          # mise.toml only pins the Bun major. Refresh the cache daily so CI gets new versions.
          cache_max_age_days: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - uses: entur/gha-npmjs/.github/actions/prepare-packages@f2048c5471857dbe65504f960f2ef0fe17099c78 # v1.1.1
        with:
          release_type: manifest
          package_manager: bun

  docker-build:
    uses: entur/gha-docker/.github/workflows/build.yml@dcdc76ce2d251de20f35a92c566d8fe99036e03e # v1.13.0

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
    secrets:
      external_repository_token: ${{ secrets.EXTERNAL_REPOSITORY_TOKEN }}
