name: PR
on:
  pull_request:

jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@v1
    with:
      environment: dev
      chart: helm/uniformen

  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun test
      - name: Audit (fail on critical)
        run: bun audit --audit-level=critical

  docker-build:
    uses: entur/gha-docker/.github/workflows/build.yml@v1

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2.12.2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
