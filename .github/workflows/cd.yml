name: CD
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - name: Audit (fail on critical)
        run: bun audit --audit-level=critical

  docker-build:
    uses: entur/gha-docker/.github/workflows/build.yml@v1

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2.15.1
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
    secrets:
      external_repository_token: ${{ secrets.EXTERNAL_REPOSITORY_TOKEN }}

  docker-push:
    needs: [docker-build, build]
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  post-to-slack:
    needs: [docker-push]
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: "GGH1Y21N0"
      message: "Deployed ${{ github.repository }}/${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}} to GAR :rocketup:"
    secrets: inherit

  post-to-slack-if-failure:
    needs: [docker-push]
    if: ${{ failure() }}
    uses: entur/gha-slack/.github/workflows/post.yml@v3
    with:
      channel_id: "GGH1Y21N0"
      message: "Failure to deploy ${{ github.repository }} \n ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} :crycat:"
    secrets: inherit

  helm-deploy-dev:
    needs: [docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: dev
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"

  helm-deploy-tst:
    needs: [docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: tst
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"

  approval-step:
    runs-on: ubuntu-24.04
    needs: [helm-deploy-tst]
    environment: apr
    steps:
      - name: Approval step
        id: approval
        shell: bash
        run: echo "Approve the deployment to prd"

  helm-deploy-prd:
    needs: [approval-step, docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: prd
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"
