name: CD
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run fmt:check
      - name: Test
        run: bun run test
      - name: Audit (fail on critical)
        run: bun audit --audit-level=critical

  docker-build:
    uses: entur/gha-docker/.github/workflows/build.yml@664fc307771c3dd17d2cc3925ea330d7f0c5f24c # v1.12.0

  docker-scan:
    name: Docker Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@aafa20a94ac3b2fbafb2951747b92a570e9e8542 # v2.16.0
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}
    secrets:
      external_repository_token: ${{ secrets.EXTERNAL_REPOSITORY_TOKEN }}

  docker-push:
    needs: [docker-build, build]
    uses: entur/gha-docker/.github/workflows/push.yml@664fc307771c3dd17d2cc3925ea330d7f0c5f24c # v1.12.0

  post-to-slack:
    needs: [docker-push]
    uses: entur/gha-slack/.github/workflows/post.yml@d8260cd3e326507200f1ccccf195e81ffcbbe7d9 # v3.1.3
    with:
      channel_id: "GGH1Y21N0"
      message: "Deployed ${{ github.repository }}/${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}} to GAR :rocketup:"
    secrets: inherit

  post-to-slack-if-failure:
    needs: [docker-push]
    if: ${{ failure() }}
    uses: entur/gha-slack/.github/workflows/post.yml@d8260cd3e326507200f1ccccf195e81ffcbbe7d9 # v3.1.3
    with:
      channel_id: "GGH1Y21N0"
      message: "Failure to deploy ${{ github.repository }} \n ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} :crycat:"
    secrets: inherit

  helm-deploy-dev:
    needs: [docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@eebe21e7625a695085aefd79f64893a34adc2302 # v2.0.0
    with:
      environment: dev
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"

  helm-deploy-tst:
    needs: [docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@eebe21e7625a695085aefd79f64893a34adc2302 # v2.0.0
    with:
      environment: tst
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"

  approval-step:
    runs-on: ubuntu-24.04
    needs: [helm-deploy-tst]
    environment: apr
    steps:
      - name: Approval step
        id: approval
        shell: bash
        run: echo "Approve the deployment to prd"

  helm-deploy-prd:
    needs: [approval-step, docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@eebe21e7625a695085aefd79f64893a34adc2302 # v2.0.0
    with:
      environment: prd
      namespace: uniformen
      image: "${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}"
