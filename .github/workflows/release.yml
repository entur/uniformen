name: Release

on:
  push:
    branches:
      - main
  # Builds and publishes a release that is already tagged, for example after a failed
  # publish. Run it from main so it uses the current workflow files.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example @entur/uniformen@0.15.0"
        required: true
        type: string

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    uses: entur/gha-meta/.github/workflows/release.yml@c3ca051ef943942321084a21ec919bc8097dfd92 # v1
    with:
      release_type: manifest
    permissions:
      contents: write
      pull-requests: write
      issues: write

  build-package:
    name: Build @entur/uniformen
    needs: [release-please]
    # release-please is skipped on a manual run, so !cancelled() is needed for this job to run at all.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.prepare-packages.outputs.artifact_name }}
    defaults:
      run:
        working-directory: packages/uniformen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a push, so the push commit is checked out.
          ref: ${{ inputs.tag }}
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # Dependabot does not update this version. Bump it by hand.
          version: 2026.9.18
          # mise.toml only pins the Bun major. Refresh the cache daily so CI gets new versions.
          cache_max_age_days: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - id: prepare-packages
        uses: entur/gha-npmjs/.github/actions/prepare-packages@a6dec5a97a11246d4f33879078ff53b394d55355 # v1.1.0
        with:
          release_type: manifest
          package_manager: bun

  publish-package:
    name: Publish @entur/uniformen to npm
    needs: [build-package]
    # Without this, the job is skipped on a manual run because release-please was skipped.
    if: ${{ !cancelled() && needs.build-package.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: entur/gha-npmjs/.github/workflows/publish.yml@a6dec5a97a11246d4f33879078ff53b394d55355 # v1.1.0
    with:
      artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      provenance: true
