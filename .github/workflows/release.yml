name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    uses: entur/gha-meta/.github/workflows/release.yml@c14eef7f4d90ed1be2c1df4dfb0927322bcbb3ba # v1
    with:
      release_type: manifest
    permissions:
      contents: write
      pull-requests: write
      issues: write

  publish-package:
    name: Publish @entur/uniformen to npm
    needs: [release-please]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/uniformen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Publish #TODO: Remove publishing without provenance when we make the repository public
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            npm publish --provenance --access public
          else
            echo "::warning::repository is private — publishing without provenance"
            npm publish --access public
          fi
